# My Home Assistant links (https://my.home-assistant.io). They open the
# user's own Home Assistant at the right page. Single source for the web
# interface (web/src/lib/myLinks.js) and the Android app (BuildConfig.MY_*);
# the READMEs, DOCS.md and rezeptplaner-ha repeat them as text.
#
# Redirect names checked against
# https://github.com/home-assistant/my.home-assistant.io/blob/main/redirect.json
# on 2026-11-10:
# - supervisor_app (Core 2026.2, formerly supervisor_addon): adds the app
#   repository given in repository_url if needed and shows the app. The slug
#   prefix 45a92d34 is the Supervisor's repository hash: the first 8 hex digits
#   of sha1(lowercase repository URL).
# - supervisor_add_addon_repository: only adds the repository (fallback).
# - marketplace_repository (Core 2026.11, formerly hacs_repository): opens the
#   integration in the Marketplace; older versions forward it to HACS.
# - config_flow_start: starts setting up the integration.
app_install=https://my.home-assistant.io/redirect/supervisor_app/?app=45a92d34_rezeptplaner&repository_url=https%3A%2F%2Fgithub.com%2FThomas1607Haja%2FRezepteverwaltung_Essenplan
app_repository=https://my.home-assistant.io/redirect/supervisor_add_addon_repository/?repository_url=https%3A%2F%2Fgithub.com%2FThomas1607Haja%2FRezepteverwaltung_Essenplan
integration_download=https://my.home-assistant.io/redirect/marketplace_repository/?owner=Thomas1607Haja&repository=rezeptplaner-ha&category=integration
integration_setup=https://my.home-assistant.io/redirect/config_flow_start/?domain=rezeptplaner
