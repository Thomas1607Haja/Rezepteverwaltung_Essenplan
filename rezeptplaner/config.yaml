# Konfiguration der Home-Assistant-App „Rezeptplaner“.
# Referenz: https://contributors.home-assistant.io/apps/reference/configuration/
name: Rezeptplaner
# Muss zum Tag der neuen Version passen (v0.1.0 -> "0.1.0"); die GitHub
# Action prüft das. Home Assistant lädt das Image mit genau dieser Version.
version: "0.12.0"
slug: rezeptplaner
description: Rezepte verwalten, Essensplan und Einkaufsliste
url: https://github.com/Thomas1607Haja/Rezepteverwaltung_Essenplan
# Nur der Home Assistant Green (ARM64); weitere Plattformen bei Bedarf.
arch:
  - aarch64
# Fertiges Image von der GitHub Action; der Green baut nichts selbst.
image: ghcr.io/thomas1607haja/rezeptplaner

# Weboberfläche in der Seitenleiste, Anmeldung über Home Assistant.
# Der Server lauscht auf 8099 und nimmt nur Verbindungen vom
# Ingress-Vermittler an (siehe Dockerfile).
ingress: true
ingress_port: 8099
panel_icon: mdi:chef-hat
panel_title: Essensplan

# Zugriff auf die REST-API von Home Assistant (über den Supervisor), um
# die Einkaufsliste in eine To-do-Liste wie Bring zu schreiben. Der
# Supervisor stellt dafür SUPERVISOR_TOKEN bereit.
homeassistant_api: true

# Meldet die App bei Home Assistant an (Supervisor-Discovery). Die
# Integration "rezeptplaner" (HACS) erscheint dann unter "Entdeckt" und
# bekommt Adresse und Schlüssel für lesenden Zugriff im internen Netz.
discovery:
  - rezeptplaner

# App-Zugang für die Android-App: Port 8100 verlangt bei jeder Anfrage
# einen API-Schlüssel (anlegen in den Einstellungen der Weboberfläche).
# "null" heißt: auf dem Green nach außen nicht freigegeben. Der
# Cloudflare-Tunnel (eigene App im Supervisor-Netz) erreicht den Port
# trotzdem über den Hostnamen der App, siehe docs/APP-ZUGANG.md.
ports:
  8100/tcp: null
ports_description:
  8100/tcp: App-Zugang (nur mit API-Schlüssel)

# Während eines Backups wird die App kurz gestoppt. So ist die Datenbank
# (SQLite mit WAL-Datei) garantiert in einem sauberen Zustand.
backup: cold

# Prüft, ob der Server noch Verbindungen annimmt, und startet ihn sonst neu.
# tcp statt http, weil der Server nur Anfragen über Ingress beantwortet.
watchdog: "tcp://[HOST]:[PORT:8099]"

# Einstellungen auf dem Reiter "Konfiguration" der App. Der Server liest
# sie aus /data/options.json.
# app_repository: GitHub-Repository mit den Releases der Android-App
# (besitzer/name). Daraus entstehen die QR-Codes unter Einstellungen →
# App installieren. Nur für einen eigenen Fork ändern.
options:
  app_repository: Thomas1607Haja/Rezepteverwaltung_Essenplan
schema:
  app_repository: str?
