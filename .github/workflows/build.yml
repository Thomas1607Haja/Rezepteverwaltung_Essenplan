# Prüft jeden Push und baut das Image der Home-Assistant-App.
#
# - Jeder Push und Pull Request: Weboberfläche bauen, Go-Tests, Image
#   probeweise bauen (ohne Hochladen) – so fällt ein kaputtes Dockerfile
#   sofort auf und nicht erst bei einer neuen Version.
# - Tag v1.2.3: Image bauen und als ghcr.io/thomas1607haja/rezeptplaner:1.2.3
#   hochladen. Die Version muss zu rezeptplaner/config.yaml passen, denn
#   Home Assistant lädt genau das Image mit dieser Version.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Nur lesen, außer wo ein Job mehr braucht.
permissions:
  contents: read

env:
  # ghcr.io verlangt Kleinbuchstaben.
  IMAGE: ghcr.io/thomas1607haja/rezeptplaner

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Weboberfläche bauen
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Go prüfen und testen
        working-directory: server
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "Bitte gofmt ausführen"; exit 1; }
          go vet ./...
          go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Image nach ghcr.io hochladen
    steps:
      - uses: actions/checkout@v7

      # Bei einem Tag: Version aus dem Tag lesen (v0.1.0 -> 0.1.0) und mit
      # config.yaml vergleichen.
      - name: Version prüfen
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          configured=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' rezeptplaner/config.yaml)
          if [ "$version" != "$configured" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu version \"$configured\" in rezeptplaner/config.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: steps.version.outputs.version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen (bei einem Tag auch hochladen)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ steps.version.outputs.version != '' }}
          build-args: VERSION=${{ steps.version.outputs.version || 'test' }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version || 'test' }}
          # Zwischenstände im Cache von GitHub Actions: spätere Builds
          # übernehmen unveränderte Stufen (z. B. npm ci).
          cache-from: type=gha
          cache-to: type=gha,mode=max
