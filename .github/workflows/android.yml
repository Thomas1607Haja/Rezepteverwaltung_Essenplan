# Baut die Android-App.
#
# - Push/Pull Request mit Änderungen unter android/: Debug-APK bauen,
#   Unit-Tests und Lint; die Debug-APK liegt als Artefakt am Lauf.
# - Tag android-v1.2.3: signierte Release-APK bauen und als GitHub-Release
#   veröffentlichen (Obtainium auf dem Handy holt sie von dort). Die Version
#   muss zu appVersionName in android/gradle.properties passen.
#
# Geheime Werte (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   Signaturschlüssel (.jks), base64-kodiert
#   ANDROID_KEYSTORE_PASSWORD Passwort des Schlüsselspeichers
#   ANDROID_KEY_ALIAS         Alias des Schlüssels
#   ANDROID_KEY_PASSWORD      Passwort des Schlüssels
name: Android

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Prüft auch, dass gradle-wrapper.jar unverändert von Gradle stammt.
      - uses: gradle/actions/setup-gradle@v6

      - name: Debug-APK, Tests und Lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - uses: actions/upload-artifact@v7
        with:
          name: rezeptplaner-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-bericht
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub-Release anlegen
    steps:
      - uses: actions/checkout@v7

      - name: Version prüfen
        run: |
          tag="${GITHUB_REF_NAME#android-v}"
          configured=$(sed -n 's/^appVersionName=//p' gradle.properties)
          if [ "$tag" != "$configured" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu appVersionName=$configured in android/gradle.properties"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Geheimer Wert ANDROID_KEYSTORE_BASE64 fehlt – siehe Kopf dieser Datei"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Signatur prüfen
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "$RUNNER_TEMP/rezeptplaner-$VERSION.apk"

      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/rezeptplaner-$VERSION.apk" \
            --title "Android-App $VERSION" \
            --notes "Rezeptplaner für Android, Version $VERSION. Installation und Updates über Obtainium (siehe docs/ANDROID.md)."
